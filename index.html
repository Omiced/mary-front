<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marify </title>
  <link rel="icon" type="image/svg+xml" href="/images/favicon.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <nav class="navbar bg-body-tertiary">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">Marify</span>
    </div>
  </nav>
  <h1 class="text-center fs-4 mt-3">Bienvenido a marify tu app de música favorita</h1>
  <form class="w-50 mt-3 mx-auto">
    <fieldset>
      <legend class="text-center">Formulario de Registro</legend>
      <div class="mb-3">
        <label for="name" class="form-label">Nombre</label>
        <input type="text" name="name" id="name" class="form-control" aria-describedby="input para el nombre">
      </div>
      <div class="mb-3">
        <label for="" class="form-label">Email</label>
        <input type="email" name="email" id="email" class="form-control">
      </div>
      <div class="mb-3">
        <label for="" class="form-label">Password</label>
        <input type="password" name="password" id="password" class="form-control">
      </div>
      <button class="btn btn-primary w-100" type="submit">Registrarse</button>
    </fieldset>
  </form>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script type="module" src="app.js"></script>
  <script type="module" src="./services/auth.service.js"></script>
  <script type="module" src="/util/alerts.js"></script>
</body>

</html>
